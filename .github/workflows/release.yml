name: Release
on:
  push:
    tags: ['v*']

# Required by softprops/action-gh-release to create the GitHub Release.
permissions:
  contents: write

jobs:
  publish-crate:
    uses: skegdb/.github/.github/workflows/release-cargo.yml@main
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  build-binaries:
    strategy:
      fail-fast: false
      matrix:
        # aarch64 only. skeg-cli links skeg-vector which carries the
        # NEON SIMD kernels; x86_64 would compile via scalar fallback.
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          fi
          cargo build --release --target ${{ matrix.target }} --bin skeg-cli --locked
      - run: |
          cd target/${{ matrix.target }}/release
          NAME="skeg-cli-${{ github.ref_name }}-${{ matrix.target }}"
          tar -czf "${NAME}.tar.gz" skeg-cli
          shasum -a 256 "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            target/${{ matrix.target }}/release/skeg-cli-*.tar.gz
            target/${{ matrix.target }}/release/skeg-cli-*.tar.gz.sha256

  # Custom one-shot brew bump. mislav's action stops working on the
  # second invocation because the version field is already at the
  # target ("Skipping: the formula is already at version X"), which
  # left the linux branch's sha256 stale on v0.1.1. This job clones
  # the tap, rewrites `version`, the mac sha256, and the linux sha256
  # in a single commit, then pushes. Both url lines are kept as the
  # `v#{version}` template, so only the version + the two checksums
  # ever need touching here.
  bump-homebrew:
    needs: build-binaries
    runs-on: ubuntu-latest
    env:
      FORMULA: Formula/skeg-cli.rb
      DOWNLOAD_BASE: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
      TARBALL_PREFIX: skeg-cli-${{ github.ref_name }}
    steps:
      - name: fetch per-platform sha256 from the GitHub Release
        id: sha
        run: |
          set -eo pipefail
          MAC=$(curl -sL "${DOWNLOAD_BASE}/${TARBALL_PREFIX}-aarch64-apple-darwin.tar.gz.sha256" | awk '{print $1}')
          LINUX=$(curl -sL "${DOWNLOAD_BASE}/${TARBALL_PREFIX}-aarch64-unknown-linux-gnu.tar.gz.sha256" | awk '{print $1}')
          [ -n "$MAC" ] && [ -n "$LINUX" ] || { echo "missing sha256"; exit 1; }
          echo "mac=$MAC" >> "$GITHUB_OUTPUT"
          echo "linux=$LINUX" >> "$GITHUB_OUTPUT"
      - name: clone the tap
        env:
          TOKEN: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
        run: |
          set -eo pipefail
          git clone --depth=1 "https://x-access-token:${TOKEN}@github.com/skegdb/homebrew-tap.git" tap
      - name: rewrite version + per-platform sha256
        env:
          MAC_SHA: ${{ steps.sha.outputs.mac }}
          LINUX_SHA: ${{ steps.sha.outputs.linux }}
        run: |
          set -eo pipefail
          VERSION_NO_V="${GITHUB_REF_NAME#v}"
          python3 - "tap/${FORMULA}" "$VERSION_NO_V" "$MAC_SHA" "$LINUX_SHA" <<'PY'
          import re, sys
          path, version, mac_sha, linux_sha = sys.argv[1:5]
          lines = open(path).read().split('\n')
          state = None
          for i, line in enumerate(lines):
              stripped = line.strip()
              if re.match(r'if OS\.mac\?', stripped):
                  state = 'mac'
              elif re.match(r'elsif OS\.linux\?', stripped):
                  state = 'linux'
              elif stripped == 'end':
                  state = None
              if stripped.startswith('version "'):
                  lines[i] = re.sub(r'"[^"]*"', f'"{version}"', line, count=1)
              elif 'sha256 "' in line:
                  sha = mac_sha if state == 'mac' else linux_sha if state == 'linux' else None
                  if sha:
                      lines[i] = re.sub(r'sha256 "[^"]*"', f'sha256 "{sha}"', line, count=1)
          open(path, 'w').write('\n'.join(lines))
          PY
      - name: commit and push
        run: |
          set -eo pipefail
          cd tap
          git config user.name "skegdb-bot"
          git config user.email "bot@users.noreply.github.com"
          git add "$FORMULA"
          if git diff --cached --quiet; then
            echo "formula unchanged; nothing to commit"
            exit 0
          fi
          VERSION_NO_V="${GITHUB_REF_NAME#v}"
          git commit -m "skeg-cli ${VERSION_NO_V}: bump version + aarch64 darwin/linux sha256"
          git push origin main
